services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - ./database/supermarket6.sql:/docker-entrypoint-initdb.d/supermarket6.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    environment:
      DB_URL: "jdbc:mysql://db:3306/supermarket6?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8"
      DB_USER: "root"
      DB_PASSWORD: "123456"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
